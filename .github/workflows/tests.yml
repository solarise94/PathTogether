name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 必需 job 1/4：PG 后端全量（python-pg；conftest 无条件起内嵌 PostgreSQL）。
  # json 后端已退役（R3 Wave 3），不再有 python-json job。
  python-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # 覆盖率（test-review P3-19）：fail-under=72 —— 本机 PG 全量 TOTAL 82%，
      # 减 10 点余量（原 json 54%−10=44 的同口径）。Batch D re-baseline。
      - run: python -m pytest tests -q --cov=. --cov-report=term --cov-report=xml --cov-fail-under=72
        env:
          RUN_PG_TESTS: "1"

  # 必需 job 2/4：PG canary 独立必需 job（一次性修复包 G §11.2）。
  # 拆出独立 job 并先于全量收敛语义：canary 只证明「runner 真的启动了
  # PostgreSQL 且 conftest 生效」；全量失败时 canary 不再被连坐 skip。
  python-pg-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: PG canary 必须真实执行（不可 skip）
        run: |
          set -o pipefail
          python -m pytest tests/test_pg_backend_canary.py -q -rA | tee canary-out.txt
          if grep -qiE "skipped|no tests ran" canary-out.txt; then
            echo "::error::PG canary 被 skip——pgserver/psycopg 缺失或 env 未生效"
            exit 1
          fi
          grep -q "passed" canary-out.txt || {
            echo "::error::PG canary 没有 passed 输出（未真实执行）"
            exit 1
          }

  # 必需 job 3/4：HostBridge / 插件 JS 单元（Vitest）
  host-bridge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:js

  # 必需 job 4/4：管理工作台真实 Chromium E2E（一次性修复包 F §10）。
  # webServer 起临时目录 + 内嵌 PostgreSQL + 一次性凭据的被测应用；
  # 凭据只经临时文件传递，不写日志/artifact；截图仅测试虚构数据。
  admin-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:admin
        env:
          CI: "1"
      - name: 上传 E2E 截图（仅测试虚构数据）
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admin-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
