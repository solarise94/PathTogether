# pt-edge：PathTogether 公网 TLS 边缘（docs open-registration-security-remediation §3.2/§3.11）
# SakuraFrp（路由器 192.168.8.1）→ 本机 18443（HTTPS）→ 127.0.0.1:18080（gunicorn HTTP）
# 18080 保持明文：容器内 sidecar 回调与 LAN 健康检查依赖它，TLS 只在本层终止。
# U4（2026-08-26）：client_body_timeout 600s + 上传专用 access_log（request_length /
# request_time / upstream_response_time）+ /api/upload(s) 更宽 send 超时。
worker_processes 1;
pid /run/user/1000/pt-edge.pid;
error_log /home/solarise/.local/log/pt-edge/error.log warn;

events { worker_connections 1024; }

http {
    access_log /home/solarise/.local/log/pt-edge/access.log;
    log_format upload '$remote_addr $status $request_length $request_time '
                      '$upstream_response_time "$request"';
    # 管理插件资源（复核 P2 2026-08-29）：专用格式不记 query string——
    # 资源 URL 携带短时 bearer token（pt_at），默认 combined 格式的 $request
    # 会把它写进 access log，违反「不把 token 写日志」红线。
    log_format no_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    client_body_temp_path /home/solarise/.cache/pt-edge/tmp/body;
    proxy_temp_path       /home/solarise/.cache/pt-edge/tmp/proxy;
    fastcgi_temp_path     /home/solarise/.cache/pt-edge/tmp/fastcgi;
    uwsgi_temp_path       /home/solarise/.cache/pt-edge/tmp/uwsgi;
    scgi_temp_path        /home/solarise/.cache/pt-edge/tmp/scgi;

    # 默认 60s 会在弱网大文件短暂无流量时掐断（U4）
    client_body_timeout 600s;

    server {
        listen 0.0.0.0:18443 ssl;
        http2 on;
        server_name pt.solarise94.fun;
        ssl_certificate /home/solarise/.local/share/pt-certbot/config/live/pt.solarise94.fun/fullchain.pem;
        ssl_certificate_key /home/solarise/.local/share/pt-certbot/config/live/pt.solarise94.fun/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Keep certificate renewal reachable; every application path redirects.
        location ^~ /.well-known/acme-challenge/ {
            root /home/solarise/.local/share/pt-acme-webroot;
            default_type text/plain;
        }
        location / { return 308 https://histopilot.cn$request_uri; }
    }

    server {
        listen 0.0.0.0:18444 ssl proxy_protocol;
        http2 on;
        server_name pt.solarise94.fun;
        ssl_certificate /home/solarise/.local/share/pt-certbot/config/live/pt.solarise94.fun/fullchain.pem;
        ssl_certificate_key /home/solarise/.local/share/pt-certbot/config/live/pt.solarise94.fun/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Keep certificate renewal reachable; every application path redirects.
        location ^~ /.well-known/acme-challenge/ {
            root /home/solarise/.local/share/pt-acme-webroot;
            default_type text/plain;
        }
        location / { return 308 https://histopilot.cn$request_uri; }
    }

    # International HTTP backend; local frpc over TLS to LA nginx. No PROXY protocol.
    server {
        listen 127.0.0.1:18445;
        access_log /home/solarise/.local/log/pt-edge/international-access.log no_query;
        error_log /home/solarise/.local/log/pt-edge/international-error.log warn;
        server_name histopilot.com;


        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        add_header Strict-Transport-Security "max-age=300" always;

        client_max_body_size 10g;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        location ^~ /admin/plugin-assets/ {
            access_log /home/solarise/.local/log/pt-edge/international-admin-assets.log no_query;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /internal/ { return 404; }
        location /api/plugin/ { return 404; }

        location ^~ /api/uploads {
            client_body_timeout 600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            access_log /home/solarise/.local/log/pt-edge/international-upload.log upload;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /api/upload {
            client_body_timeout 600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            access_log /home/solarise/.local/log/pt-edge/international-upload.log upload;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
    include /home/solarise/.config/pt-edge/histopilot-cn.conf;
}
