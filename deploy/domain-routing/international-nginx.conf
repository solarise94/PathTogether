# Only the actual Cloudflare connection peer may supply visitor country.
geo $realip_remote_addr $hp_cloudflare_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$hp_cloudflare_peer:$http_cf_ipcountry" $hp_china_visitor {
    default 0;
    "1:CN" 1;
}
# Redirect page navigation, never replay API calls or redirect module/WASM loads.
map $uri $hp_page_path {
    default 1;
    ~^/(api|static|internal|admin/plugin-assets)(/|$) 0;
    ~^/(healthz|favicon\.ico|robots\.txt)$ 0;
    ~^/\.well-known/ 0;
}
map "$request_method:$hp_china_visitor:$hp_page_path" $hp_redirect_cn {
    default 0;
    "GET:1:1" 1;
    "HEAD:1:1" 1;
}
# histopilot.com: TLS terminates here; encrypted frp tunnel -> homePC:18445.
# Initial vhost/certificate created with add-vhost and Certbot.
log_format histopilot_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time $upstream_response_time';
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name histopilot.com;
    # Temporary geo redirect; must not be cached across countries.
    if ($hp_redirect_cn) { return 302 https://histopilot.cn$request_uri; }
    add_header Cache-Control "no-store" always;
    ssl_certificate /etc/letsencrypt/live/histopilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/histopilot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Trust CF-Connecting-IP only from official Cloudflare address ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    access_log /var/log/nginx/histopilot.com.access.log histopilot_no_query;
    error_log /var/log/nginx/histopilot.com.error.log warn;
    client_max_body_size 10g;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 600s;
    add_header Strict-Transport-Security "max-age=300" always;
    location /internal/ { return 404; }
    location /api/plugin/ { return 404; }
    # AI SSE: keep every event incremental through the international origin.
    location ^~ /api/demo/ai/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:13001;
    }
    location ^~ /api/ai/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:13001;
    }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:13001;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name histopilot.com;
    access_log /var/log/nginx/histopilot.com.access.log histopilot_no_query;
    return 301 https://histopilot.com$request_uri;
}
