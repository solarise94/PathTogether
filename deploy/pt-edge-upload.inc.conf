# pt-edge 上传加固片段（Upload V2 方案 U4）
# 合入 ~/.config/pt-edge/nginx.conf 的 http { } 与两个 server { }。
# 不含证书路径；由运维在边缘配置里 include / 手工同步。

# ---- 放在 http { } 内 ----
# 区分：客户端断线（request_length 短 + request_time 长）/
#       隧道中断（upstream_response_time 空或远小于 request_time）/
#       应用拒绝（status 4xx/5xx + upstream_response_time 有值）。
log_format upload '$remote_addr $status $request_length $request_time '
                  '$upstream_response_time "$request"';

# ---- 放在每个 server { } 内（18443 与 18444 都要）----
# 默认 client_body_timeout=60s，弱网大文件短暂无流量会被边缘掐断。
client_body_timeout 600s;

# /api/uploads 必须写在 /api/upload 前面（最长前缀）。
location ^~ /api/uploads {
    client_body_timeout 600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    access_log /home/solarise/.local/log/pt-edge/upload.log upload;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # 18443（无 PP）：X-Forwarded-For $proxy_add_x_forwarded_for
    # 18444（PPv2）：X-Forwarded-For $remote_addr（覆写，防伪造）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /api/upload {
    client_body_timeout 600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    access_log /home/solarise/.local/log/pt-edge/upload.log upload;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
