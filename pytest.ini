# pytest 配置（性能 review 2026-08-31 v2.1 P0-5）：
#   pythonpath —— 把仓库根加入 sys.path，使 conftest import 期的 `import
#   pg_store`（PG 模式）与各测试模块的 `import app` 不再依赖调用方式。
#   此前只有 `python -m pytest`（CWD 进 sys.path）能跑 RUN_PG_TESTS=1，
#   裸 `pytest` 直接 ModuleNotFoundError。
#   注意：coverage 的 source/omit 配置在 .coveragerc（与本文件无关）。
[pytest]
pythonpath = .
testpaths = tests
# services/*/tests 不属于本套件（各服务自带 venv，如 services/contour-refine
# 需 torch/sam2；testpaths=tests 已将其排除在默认收集之外，勿改为全仓收集）。
markers =
    site_stats_app_wiring: site stats app wiring contract tests (D2)
