[package]
name = "slide-transform-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "C1 wasm32 bindings: probe/convert over JS-provided read/write callbacks"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["codecs"]
# F2: the shipped browser artifact includes the JPEG 2000 decoder — same
# scalar feature set as the native build (byte-parity contract).
codecs = ["slide-transform-core/codecs", "slide-transform-core/jp2k"]

[dependencies]
slide-transform-core = { path = "../core", default-features = false }
wasm-bindgen = { workspace = true }
sha2 = { workspace = true }
