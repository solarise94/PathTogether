<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PathTogether</title>
  <link rel="stylesheet" href="/static/style.css?v=20260826preview" />
  <!-- OpenSeadragon 5.0.1（已本地化） -->
  <script src="/static/openseadragon.min.js"></script>
  <!-- 中英双语切换（必须在 app.js 之前加载，提供 window.HP_I18N） -->
  <script src="/static/i18n.js?v=20260826preview"></script>
</head>
<body class="app-mode-official" data-app-mode="official">
  <script>
    // 上传修复 A1：capabilities 内含非敏感的 upload_v2_threshold_bytes
    // （服务端 UPLOAD_V2_THRESHOLD_BYTES 唯一权威；前端解析失败回落 16MiB）
    window.HP_APP_BOOTSTRAP = {
      mode: "official",
      capabilities: {{ capabilities | tojson }}
    };
  </script>
  {% include "_app_shell.html" %}

  {% if histopilot_ui_enabled %}
  <!-- 桥协议版本共享工具（Stage 5-1）：先于 host-bridge.js / bridge-client.js 加载，
       提供 window.BridgeVersion（compat / PROTOCOL_VERSION / negotiate）。
       未加载时两侧各自有内联兜底，host/插件不崩 -->
  <script src="/static/bridge-version.js?v=20260814stage5"></script>
  <!-- HostBridge host 端（平台侧）。先于插件 bundle 加载，提供 window.HostBridgeHost -->
  <script src="/static/host-bridge.js?v=20260816p2fix"></script>
  <script src="/static/plugin-permissions.js?v=20260816p5fix"></script>
  <!-- HistoPilot 插件 UI bundle（同源独立加载）。顺序敏感：bridge-client 建命名空间，
       其余文件向 window.HistoPilot 挂载能力；main.js 为入口，最后加载。
       加载早于 app.js，使平台 init 时 window.HistoPilot 已就绪 -->
  <script src="/plugins/histopilot/ui/bridge-client.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/api.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/sse.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/renderer.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/config-panel.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/sessions.js?v=20260827view"></script>
  <script src="/plugins/histopilot/ui/main.js?v=20260827view"></script>
  {% endif %}
  <script src="/static/app-mode.js?v=20260904batch4"></script>
  <script src="/static/viewer-core.js?v=20260818shell1"></script>
  <!-- 多通道通道着色（Batch 4）：三页面共用组件，须先于 app.js 加载 -->
  <script src="/static/channel-controls.js?v=20260904batch4"></script>
  <script src="/static/app.js?v=20260904batch4"></script>
</body>
</html>
