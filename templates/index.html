<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HistoPilot Beta</title>
  <link rel="stylesheet" href="/static/style.css?v=20261009c" />
  <!-- OpenSeadragon 5.0.1（已本地化） -->
  <script src="/static/openseadragon.min.js"></script>
  <!-- 中英双语切换（必须在 app.js 之前加载，提供 window.HP_I18N） -->
  <script src="/static/i18n.js?v=20261009c"></script>
</head>
<body class="app-mode-official" data-app-mode="official">
  <script>
    // 上传修复 A1：capabilities 内含非敏感的 upload_v2_threshold_bytes
    // （服务端 UPLOAD_V2_THRESHOLD_BYTES 唯一权威；前端解析失败回落 16MiB）
    window.HP_APP_BOOTSTRAP = {
      mode: "official",
      capabilities: {{ capabilities | tojson }}
    };
  </script>
  {% include "_app_shell.html" %}

  {% if histopilot_ui_enabled %}
  <!-- 桥协议版本共享工具（Stage 5-1）：先于 host-bridge.js / bridge-client.js 加载，
       提供 window.BridgeVersion（compat / PROTOCOL_VERSION / negotiate）。
       未加载时两侧各自有内联兜底，host/插件不崩 -->
  <script src="/static/bridge-version.js?v=20260814stage5"></script>
  <!-- HostBridge host 端（平台侧）。先于插件 bundle 加载，提供 window.HostBridgeHost -->
  <script src="/static/host-bridge.js?v=20260816p2fix"></script>
  <script src="/static/plugin-permissions.js?v=20260816p5fix"></script>
  <!-- HistoPilot 插件 UI bundle（同源独立加载）。顺序敏感：bridge-client 建命名空间，
       其余文件向 window.HistoPilot 挂载能力；main.js 为入口，最后加载。
       加载早于 app.js，使平台 init 时 window.HistoPilot 已就绪 -->
  <script src="/plugins/histopilot/ui/bridge-client.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/api.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/sse.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/renderer.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/config-panel.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/sessions.js?v=20260910a"></script>
  <script src="/plugins/histopilot/ui/main.js?v=20260910a"></script>
  {% endif %}
  <script src="/static/app-mode.js?v=20260907c"></script>
  <script src="/static/viewer-core.js?v=20260907c"></script>
  <!-- P3 人工读片行为采集（独立模块，默认不采集）：只在本正式工作台页面加载；
       服务端 capabilities.research_collection 开启且 app.js 显式装配时才工作。
       demo.html / share.html 不加载本文件，viewer-core.js 也不内置采集 -->
  <script src="/static/research-viewer-telemetry.js?v=20260921"></script>
  <!-- 多通道通道着色（Batch 4）：三页面共用组件，须先于 app.js 加载 -->
  <script src="/static/viewer-encoding.js?v=20260907c"></script>
  <script src="/static/channel-controls.js?v=20260907c"></script>
  <!-- COS 直传共享引擎（C4）：工作台与 /tools/slides 共用；先于 app.js 加载，
       提供 window.HP_COS_UPLOAD（无 DOM/无 i18n，依赖全部注入） -->
  <script src="/static/upload/cos-uploader.js?v=20261007c"></script>
  <script src="/static/upload/slide-sniff.js?v=20261007"></script>
  <!-- 用户反馈客户端记录器（改版第四轮 §3）：先于 app.js 尽早装载——包装
       window.fetch / console / onerror 并记录点击控件标识。只在内存环形缓冲
       （300 条 / 15 分钟），不落盘、不上传；用户主动发送反馈时才随
       POST /api/feedback 附带。隐私红线见文件头注释。 -->
  <script src="/static/feedback-recorder.js?v=20261009"></script>
  <script src="/static/app.js?v=20261009d"></script>
  {% if histopilot_ui_enabled %}<script src="/static/ai-panel-chrome.js?v=20261009b"></script>{% endif %}
</body>
</html>
