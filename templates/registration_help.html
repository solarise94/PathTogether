<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>HistoPilot · 注册帮助</title>
  <link rel="icon" href="data:," />
  {# 页面 CSP（_apply_landing_security_headers）：style-src 'self' —— 样式必须
     走外链 CSS，不得内联 <style> / style 属性（2026-10-08 §7） #}
  <link rel="stylesheet" href="/static/registration-help.css?v=20261008a" />
  <script src="/static/i18n.js?v=20261008a"></script>
  <script defer src="/static/registration-help.js?v=20261008a"></script>
</head>
<body>
  <main class="card">
    <span class="badge" data-i18n="reghelp.badge">注册帮助</span>
    {# 原因标题：模板默认=中文（zh 词典同值）；i18n.js 按 reghelp.<reason>.title
       切换中/英文。reason 只来自服务端固定词表（app.REGISTRATION_HELP_REASONS） #}
    <h1 class="title" data-i18n="reghelp.{{ reason }}.title">{{ title_zh }}</h1>
    <p class="desc" data-i18n="reghelp.desc">如果你没有收到验证邮件、链接打不开或无法完成注册，可以给作者发邮件说明情况，作者会协助你排查。点击下方按钮将打开你的邮件客户端并预填内容，你可以先检查再发送。</p>
    {# 主操作：给作者发邮件（mailto；主题/正文已按语言标准 URL 编码）。
       href=入口默认语言版本（无 JS 可用）；data-mailto-zh / data-mailto-en
       供前端按用户当前语言切换（§5：zh/en 双版本跟随用户语言，而非域名
       默认）。正文模板只带当前受信任注册入口域名——不带邮箱/token/完整
       链接/IP。 #}
    <a class="btn primary" id="reghelp-mail" href="{{ mailto_href }}" data-mailto-zh="{{ mailto_href_zh }}" data-mailto-en="{{ mailto_href_en }}" data-i18n="reghelp.mail">给作者发邮件</a>
    <button class="btn secondary" type="button" id="reghelp-copy" data-author-email="{{ author_email }}" data-i18n="reghelp.copy">复制作者邮箱</button>
    <p class="author-email" id="reghelp-email-text">{{ author_email }}</p>
    <a class="btn secondary" href="/register" data-i18n="reghelp.back">返回注册</a>
    <div class="tpl">
      <p class="tpl-title" data-i18n="reghelp.template.title">邮件内容预览（发送前可修改）</p>
      {# 无 JS 默认：入口默认语言版本（与服务端 mailto href 一致）；
         registration-help.js 按当前语言从 data-mailto-zh/en 的 body 参数解码刷新 #}
      <pre id="reghelp-template">{% if locale == 'en' %}Hello, I ran into a problem while registering for HistoPilot.

Registration email: (fill in yourself)
Approximate time of attempt: (fill in yourself)
Registration entry: {{ entry_origin }}
Problem: no email received / link does not open / verification does not complete / other
Message shown on the page: (fill in yourself)

Please help me look into this. Thank you.{% else %}你好，我在注册 HistoPilot 时遇到了问题。

注册邮箱：（请自行填写）
大致尝试时间：（请自行填写）
注册入口：{{ entry_origin }}
问题：没有收到邮件 / 链接打不开 / 验证无法完成 / 其他
页面显示的提示：（请自行填写）

请协助排查，谢谢。{% endif %}</pre>
    </div>
    <p class="footer" data-i18n="reghelp.footer">仅用于研究、教学和软件演示，不用于临床诊断。</p>
  </main>
</body>
</html>
