<!DOCTYPE html>
<html lang="zh-CN" data-page="reset-password">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>HistoPilot · 重置密码</title>
  {% include "_site_icons.html" %}
  <link rel="stylesheet" href="/static/password-reset.css?v=20261112a" />
  <script defer src="/static/i18n.js?v=20261112a"></script>
</head>
<body>
  <main class="pr-card">
    <span class="pr-badge" data-i18n="password.reset.badge">找回密码</span>

    {% if state == 'form' %}
    <!-- token 经 POST body 提交（一次性；服务端 CSRF 校验；页面不展示完整
         邮箱，只回掩码，且 Referer 一律不外发）。 -->
    <h1 class="pr-title" data-i18n="password.reset.form.title">设置新密码</h1>
    <p class="pr-desc" data-i18n="password.reset.form.subtitle">链接有效，请在下方设置新密码（15..200 个字符）。</p>
    {% if error %}<div class="pr-error" role="alert">{{ error }}</div>{% endif %}
    <form class="pr-form" method="POST" action="/reset-password" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="token" value="{{ token }}" />
      <label for="reset-password-new" data-i18n="password.reset.new">新密码</label>
      <input id="reset-password-new" name="new_password" type="password" required
             minlength="15" maxlength="200" autocomplete="new-password" />
      <label for="reset-password-confirm" data-i18n="password.reset.confirm">确认新密码</label>
      <input id="reset-password-confirm" name="password_confirm" type="password" required
             minlength="15" maxlength="200" autocomplete="new-password" />
      <p class="pr-hint" data-i18n="password.reset.form.hint">重置成功后，所有已登录设备都需要用新密码重新登录。</p>
      <button class="pr-btn primary" type="submit" data-i18n="password.reset.submit_new">重置密码</button>
    </form>
    <div class="pr-links">
      <a href="/login" data-i18n="password.reset.back_login">返回登录</a>
    </div>
    {% else %}
    <!-- 无效/过期/已用/owner/禁用等一律同一中性提示：不泄露账号状态与细分。 -->
    <h1 class="pr-title" data-i18n="password.reset.invalid.title">链接无效或已过期</h1>
    <p class="pr-desc pr-desc-center" role="alert" data-i18n="password.reset.invalid">该重置链接无效、已过期或已被使用。请重新请求重置链接。</p>
    <div class="pr-links">
      <a href="/password-reset" data-i18n="password.reset.request_again">重新请求重置链接</a>
      <a href="/login" data-i18n="password.reset.back_login">返回登录</a>
    </div>
    {% endif %}

    <p class="pr-footer" data-i18n="password.reset.footer">仅用于研究、教学和软件演示，不用于临床诊断。</p>
  </main>
</body>
</html>
