<!DOCTYPE html>
<html lang="zh-CN" data-page="support-pay-qr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>支付宝扫码付款 · HistoPilot</title>
  <meta name="robots" content="noindex, nofollow" />
  {# 页面级 CSP（_support_pay_qr_response）：script-src/style-src 'self'、
     form-action 'none'；frame-ancestors 'self' + X-Frame-Options SAMEORIGIN
     ——本页只为 /support「支付状态」弹层的同源 iframe 存在。未决订单不渲染
     本页（服务端 303 直达支付宝网关签名 GET URL），这里只有中性/关闭两个
     静态状态。不得出现内联 <style> / style 属性 / 内联 <script>。 #}
  <link rel="stylesheet" href="/static/support/support_pay_qr.css?v=20261021f" />
  <script defer src="/static/i18n.js?v=20261026a"></script>
  <script defer src="/static/support/support_pay.js?v=20261021g"></script>
</head>
<body id="top">
  <main id="main">
    {% if pay_state == 'neutral' %}
    {# 会话绑定中性态：未知/他方订单同一响应，不渲染任何订单上下文 #}
    <section class="qr-card" aria-labelledby="qr-neutral-title">
      <h1 id="qr-neutral-title" data-i18n="supportpayqr.neutral.title">没有找到对应的订单</h1>
      <p data-i18n="supportpayqr.neutral.body">这里只处理本会话刚发起的支持订单。</p>
    </section>
    {% else %}
    <section class="qr-card" aria-labelledby="qr-closed-title">
      <h1 id="qr-closed-title" data-i18n="supportpayqr.closed.title">订单已关闭</h1>
      <p data-i18n="supportpayqr.closed.body">这个支持订单已关闭。请回到支持页重新发起。</p>
    </section>
    {% endif %}
  </main>
</body>
</html>
